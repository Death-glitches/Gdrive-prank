    <script>
        // Floating Elements Logic
        const container = document.getElementById('floating-elements-container');
        const symbols = ['verified', 'lock', 'cloud_upload', 'description', 'star', 'rocket_launch'];
        const colors = ['text-primary', 'text-secondary', 'text-tertiary', 'text-primary-fixed-dim'];
        
        for(let i = 0; i < 15; i++) {
            const span = document.createElement('span');
            span.className = `material-symbols-outlined floating-emoji ${colors[Math.floor(Math.random() * colors.length)]} text-4xl opacity-20`;
            span.textContent = symbols[Math.floor(Math.random() * symbols.length)];
            span.style.left = `${Math.random() * 100}%`;
            span.style.top = `${Math.random() * 100}%`;
            span.style.animationDelay = `${Math.random() * 5}s`;
            span.style.fontSize = `${Math.random() * (48 - 24) + 24}px`;
            container.appendChild(span);
        }

        // Fleeing Button Logic
        const fleeBtn = document.getElementById('flee-button');
        const btnContainer = document.getElementById('button-container');

       fleeBtn.addEventListener('mouseover', () => {
    const moveDistance = 200; // Maximum pixels to move
    const margin = 20;

    fleeBtn.style.position = 'fixed';
    fleeBtn.style.zIndex = '1000';
    fleeBtn.style.right = 'auto';
    fleeBtn.style.bottom = 'auto';
    fleeBtn.style.transform = 'none';

    const width = fleeBtn.offsetWidth;
    const height = fleeBtn.offsetHeight;

    let x = fleeBtn.offsetLeft + (Math.random() * 2 - 1) * moveDistance;
    let y = fleeBtn.offsetTop + (Math.random() * 2 - 1) * moveDistance;

    // Keep it inside the viewport
    x = Math.max(margin, Math.min(x, window.innerWidth - width - margin));
    y = Math.max(margin, Math.min(y, window.innerHeight - height - margin));

    fleeBtn.style.left = `${x}px`;
    fleeBtn.style.top = `${y}px`;
});

        // Timer Logic
        let seconds = 15;
        const timerDisplay = document.getElementById('timer-display');
        const secondsText = document.getElementById('seconds-text');
        const timerRing = document.getElementById('timer-ring');
        const confirmBtn = document.getElementById('confirm-button');
        const circum = 2 * Math.PI * 20;

        const countdown = setInterval(() => {
            seconds--;
            timerDisplay.textContent = seconds;
            secondsText.textContent = `${seconds}s`;
            
            // Update progress ring
            const offset = circum - (seconds / 15) * circum;
            timerRing.style.strokeDashoffset = offset;

            if (seconds <= 0) {
                clearInterval(countdown);
                finishTimer();
            }
        }, 1000);

        function finishTimer() {
            fleeBtn.style.display = 'none';
            confirmBtn.classList.remove('hidden');
            setTimeout(() => {
                confirmBtn.style.opacity = '1';
                confirmBtn.style.position = 'relative';
                confirmBtn.classList.add('shimmer');
            }, 50);
        }

        // Micro-interaction for the "Confirm" button
        confirmBtn.addEventListener('click', () => {
            confirmBtn.innerHTML = '<span class="material-symbols-outlined animate-spin mr-2">refresh</span> Processing...';
            confirmBtn.classList.add('opacity-80', 'cursor-not-allowed');
            setTimeout(() => {
                window.location.reload(); // Simulate success/refresh
            }, 2000);
        });
