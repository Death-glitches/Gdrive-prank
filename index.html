        const CONFIG = {

            emojiCount: 15
        };

        /**
         * Emoji Animation Logic
         */
        class FloatingEmoji {
            constructor() {
                this.element = document.createElement('div');
                this.element.className = 'floating-emoji';
                this.element.innerText = CONFIG.emojis[Math.floor(Math.random() * CONFIG.emojis.length)];
                
                this.reset();
                document.getElementById('emoji-container').appendChild(this.element);
            }

            reset() {
                this.x = Math.random() * window.innerWidth;
                this.y = window.innerHeight + 50;
                this.speed = 1 + Math.random() * 2;
                this.amplitude = 10 + Math.random() * 30;
                this.frequency = 0.002 + Math.random() * 0.005;
                this.rotation = 0;
                this.rotationSpeed = (Math.random() - 0.5) * 2;
                this.size = 20 + Math.random() * 30;
                this.element.style.fontSize = `${this.size}px`;
                this.timeOffset = Math.random() * 10000;
            }

            update(time) {
                this.y -= this.speed;
                const wave = Math.sin((time + this.timeOffset) * this.frequency) * this.amplitude;
                this.rotation += this.rotationSpeed;

                this.element.style.transform = `translate3d(${this.x + wave}px, ${this.y}px, 0) rotate(${this.rotation}deg)`;

                if (this.y < -100) {
                    this.reset();
                }
            }
        }

        const floatingObjects = Array.from({ length: CONFIG.emojiCount }, () => new FloatingEmoji());

        function animate(time) {
            floatingObjects.forEach(obj => obj.update(time));
            requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);

            });
        });
